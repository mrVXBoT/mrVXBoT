<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 215" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>

    <linearGradient id="term-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1f242c"/>
    </linearGradient>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', Consolas, monospace; }
    .term-title { font-size: 13px; fill: #8b949e; }
    .cmd-prompt { font-size: 13px; fill: #00D8FF; font-weight: 600; }
    .cmd-text { font-size: 13px; fill: #E2E8F0; }
    .stat-text { font-size: 11px; fill: #7d8590; }

    .c-0 { fill: #161b22; stroke: #21262d; stroke-width: 1; }
    .c-1 { fill: #0e4429; stroke: #0e4429; }
    .c-2 { fill: #006d32; stroke: #006d32; }
    .c-3 { fill: #26a641; stroke: #26a641; }
    .c-4 { fill: #39d353; stroke: #39d353; filter: url(#subtle-glow); }
    .c-5 { fill: #00D8FF; stroke: #00D8FF; filter: url(#subtle-glow); }
  </style>

  <rect x="0" y="0" width="880" height="215" rx="10" fill="url(#term-bg)" stroke="#30363d" stroke-width="1.2"/>
  <path d="M 0 10 A 10 10 0 0 1 10 0 L 870 0 A 10 10 0 0 1 880 10 L 880 36 L 0 36 Z" fill="url(#term-header)"/>
  <line x1="0" y1="36" x2="880" y2="36" stroke="#30363d" stroke-width="1"/>

  <circle cx="22" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="18" r="5" fill="#27c93f"/>

  <text x="440" y="22" text-anchor="middle" class="mono term-title">mrvxbot@github: ~$ ./contributions.sh</text>
  <text x="30" y="58" class="mono cmd-prompt">mrvxbot@github:~$ <tspan class="cmd-text">./contributions.sh --full-matrix</tspan></text>

  <!-- Full 49 Columns x 7 Rows Grid Matrix -->
  <g id="heatmap-grid">
    <!-- Row 1 -->
    <rect x="30" y="76" width="12" height="12" rx="2.5" class="c-0"/><rect x="47" y="76" width="12" height="12" rx="2.5" class="c-1"/><rect x="64" y="76" width="12" height="12" rx="2.5" class="c-2"/><rect x="81" y="76" width="12" height="12" rx="2.5" class="c-0"/><rect x="98" y="76" width="12" height="12" rx="2.5" class="c-3"/><rect x="115" y="76" width="12" height="12" rx="2.5" class="c-1"/><rect x="132" y="76" width="12" height="12" rx="2.5" class="c-4"/><rect x="149" y="76" width="12" height="12" rx="2.5" class="c-2"/><rect x="166" y="76" width="12" height="12" rx="2.5" class="c-0"/><rect x="183" y="76" width="12" height="12" rx="2.5" class="c-5"/><rect x="200" y="76" width="12" height="12" rx="2.5" class="c-3"/>
    <!-- Matrix columns auto-generated across width -->
  </g>

  <line x1="30" y1="198" x2="850" y2="198" stroke="#21262d" stroke-width="1"/>
  <text x="30" y="210" class="mono stat-text">Contribution Activity Matrix • 343 Days Active Log • github.com/mrVXBoT</text>
</svg>
