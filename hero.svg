<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Dark Cosmic Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#120c2e" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#090a15" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030307" stop-opacity="1"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00D8FF" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>

    <!-- Glowing Border Gradient -->
    <linearGradient id="neon-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D8FF"/>
      <stop offset="25%" stop-color="#7F00FF"/>
      <stop offset="50%" stop-color="#00FF9C"/>
      <stop offset="75%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#00D8FF"/>
    </linearGradient>

    <!-- Main Title Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D8FF"/>
      <stop offset="40%" stop-color="#00FF9C"/>
      <stop offset="75%" stop-color="#B5179E"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="border-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: 'Outfit', 'Inter', 'Segoe UI', sans-serif; }
    
    .top-badge {
      font-size: 14px;
      fill: #00D8FF;
      letter-spacing: 7px;
      font-weight: 600;
    }

    .main-name {
      font-size: 82px;
      font-weight: 900;
      fill: url(#text-grad);
      letter-spacing: 3px;
      filter: drop-shadow(0px 0px 22px rgba(0,216,255,0.45));
    }

    .subtitle {
      font-size: 17px;
      fill: #E2E8F0;
      letter-spacing: 8px;
      font-weight: 700;
    }

    .tech-pills {
      font-size: 12px;
      fill: #00FF9C;
      letter-spacing: 4px;
      font-weight: 600;
    }

    .divider {
      stroke: url(#neon-border-grad);
      stroke-opacity: 0.5;
      stroke-dasharray: 8 6;
      stroke-width: 1.8;
    }

    .corner-accent {
      stroke: #00FF9C;
      stroke-width: 3;
      stroke-linecap: round;
      fill: none;
      filter: drop-shadow(0px 0px 6px #00FF9C);
    }

    .cyber-line {
      stroke: url(#neon-border-grad);
      stroke-width: 1.5;
      fill: none;
      opacity: 0.65;
    }

    .star {
      fill: #ffffff;
      opacity: 0.35;
    }

    .status-dot {
      fill: #00FF9C;
      filter: drop-shadow(0px 0px 6px #00FF9C);
    }
  </style>

  <!-- Background Base -->
  <rect x="10" y="10" width="980" height="300" rx="22" fill="url(#bg-glow)" stroke="none"/>
  <!-- Cyber Grid -->
  <rect x="10" y="10" width="980" height="300" rx="22" fill="url(#cyber-grid)"/>

  <!-- Glowing Neon Outer Border -->
  <rect x="18" y="18" width="964" height="284" rx="18" fill="none" stroke="url(#neon-border-grad)" stroke-width="2.2" filter="url(#border-glow)"/>

  <!-- Corner Brackets ┌ ┐ └ ┘ -->
  <path d="M 40 60 L 40 42 L 58 42" class="corner-accent"/>
  <path d="M 942 42 L 960 42 L 960 60" class="corner-accent"/>
  <path d="M 40 260 L 40 278 L 58 278" class="corner-accent"/>
  <path d="M 942 278 L 960 278 L 960 260" class="corner-accent"/>

  <!-- Cyber Side Decorative Lines -->
  <!-- Left Side -->
  <path d="M 75 90 L 105 155 L 90 160 L 120 230" class="cyber-line"/>
  <circle cx="75" cy="90" r="3" fill="#00D8FF"/>
  <circle cx="120" cy="230" r="3" fill="#00FF9C"/>

  <!-- Right Side -->
  <path d="M 925 90 L 895 155 L 910 160 L 880 230" class="cyber-line"/>
  <circle cx="925" cy="90" r="3" fill="#7F00FF"/>
  <circle cx="880" cy="230" r="3" fill="#00D8FF"/>

  <!-- Ambient Stars -->
  <circle cx="160" cy="70" r="1.5" class="star"/>
  <circle cx="230" cy="220" r="1.2" class="star"/>
  <circle cx="820" cy="80" r="1.5" class="star"/>
  <circle cx="850" cy="210" r="1.2" class="star"/>

  <!-- Live Status Badge (Top-Right inside card) -->
  <g transform="translate(730, 48)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#0D1117" stroke="#00FF9C" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="18" cy="14" r="4" class="status-dot"/>
    <text x="32" y="18" class="mono" font-size="11" fill="#00FF9C" font-weight="600" letter-spacing="1">SYSTEM: ONLINE</text>
  </g>

  <!-- Main Content Center -->
  <g text-anchor="middle">
    <!-- Top Tag -->
    <text x="500" y="86" class="mono top-badge">&lt; MRVXBOT / PORTFOLIO &gt;</text>
    
    <!-- Main Name -->
    <text x="500" y="172" class="sans main-name">Amir</text>
    
    <!-- Neon Dashed Divider -->
    <line x1="310" y1="202" x2="690" y2="202" class="divider"/>
    
    <!-- Subtitle Role -->
    <text x="500" y="236" class="sans subtitle">FULL-STACK DEVELOPER · BUILDER</text>
    
    <!-- Tech Stack Pill List -->
    <text x="500" y="268" class="mono tech-pills">PYTHON · REACT · NODE.JS · NEXT.JS · LARAVEL · LINUX</text>
  </g>
</svg>
